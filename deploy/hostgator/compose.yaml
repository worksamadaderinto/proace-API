name: commerce-edge

services:
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the separate API hostname}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-proaceintlshoppingmall.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - commerce-network

networks:
  commerce-network:
    external: true
    name: ${COMMERCE_NETWORK:-commerce-network}

volumes:
  caddy-data:
  caddy-config:
